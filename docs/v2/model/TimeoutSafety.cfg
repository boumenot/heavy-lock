SPECIFICATION TimeoutSpec
CONSTANTS
  Jobs = {a}
  Weight <- UnitWeights
  Capacity = 1
  MaxBrokerCrashes = 0
  MaxRunnerCrashes = 1
  MaxDisconnects = 0
  GraceLimit = 1
  DurableFence = TRUE
  SafeAbsence = TRUE
  CompleteTracking = FALSE
  ForceWhilePaused = TRUE
  RecoveryRPCs = TRUE
  BackfillLimit = 0
INVARIANTS
  TypeOK QueueConsistent ReservationsConsistent DurableBeforeDelivery
  NoDuplicateLaunch ClaimBeforeSpawn ClaimBoundToRunner NoClaimWhenNotReady
  NoLiveRootUnreserved NoPrematureRelease NoFutureProof NoFalseNoLaunch
  UnknownOutcomeHeld
CHECK_DEADLOCK FALSE
