SPECIFICATION RecoveryAdmissionSpec
CONSTANTS
  Jobs = {a, b}
  Weight <- UnitWeights
  Capacity = 2
  MaxBrokerCrashes = 1
  MaxRunnerCrashes = 0
  MaxDisconnects = 0
  GraceLimit = 1
  DurableFence = TRUE
  SafeAbsence = TRUE
  CompleteTracking = FALSE
  ForceWhilePaused = TRUE
  RecoveryRPCs = TRUE
  BackfillLimit = 0
INVARIANTS
  TypeOK QueueConsistent ReservationsConsistent NormalCapacity NormalFIFO
  NeverForcedOverload NoReservationWhenNotReady PreexistingUncertainHeld
CHECK_DEADLOCK FALSE
