SPECIFICATION SchedulingSpec
CONSTANTS
  Jobs = {a, b, c}
  Weight <- MixedWeights
  Capacity = 2
  MaxBrokerCrashes = 0
  MaxRunnerCrashes = 0
  MaxDisconnects = 0
  GraceLimit = 1
  DurableFence = TRUE
  SafeAbsence = TRUE
  CompleteTracking = TRUE
  ForceWhilePaused = TRUE
  RecoveryRPCs = TRUE
  BackfillLimit = 1
INVARIANTS TypeOK NeverBackfill
CHECK_DEADLOCK FALSE
