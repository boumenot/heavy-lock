SPECIFICATION RecoverySchedulingSpec
CONSTANTS
  Jobs = {a, b}
  Weight <- UnitWeights
  Capacity = 1
  MaxBrokerCrashes = 1
  MaxRunnerCrashes = 0
  MaxDisconnects = 0
  GraceLimit = 1
  DurableFence = TRUE
  SafeAbsence = TRUE
  CompleteTracking = FALSE
  ForceWhilePaused = TRUE
  RecoveryRPCs = TRUE
  BackfillLimit = 0
INVARIANTS
  TypeOK QueueConsistent ReservationsConsistent DurableBeforeDelivery
  NoDuplicateLaunch ClaimBeforeSpawn ClaimBoundToRunner NoClaimWhenNotReady
  NoLiveRootUnreserved NoKnownChildUnreserved NoPrematureRelease NoFutureProof
  NoFalseNoLaunch UnknownOutcomeHeld NoReservationWhenNotReady NormalCapacity
CHECK_DEADLOCK FALSE
