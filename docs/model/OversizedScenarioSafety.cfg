SPECIFICATION OversizedSpec
CONSTANTS
  Jobs = {a, b}
  Weight <- MixedWeights
  Capacity = 1
  MaxBrokerCrashes = 0
  MaxRunnerCrashes = 0
  MaxDisconnects = 0
  GraceLimit = 1
  DurableFence = TRUE
  SafeAbsence = TRUE
  CompleteTracking = FALSE
  ForceWhilePaused = TRUE
  RecoveryRPCs = TRUE
  BackfillLimit = 1
INVARIANTS
  TypeOK QueueConsistent ReservationsConsistent NormalCapacity NormalFIFO
  NoReservationWhenNotReady OversizedNeverBypassed OversizedNeverNormal
CHECK_DEADLOCK FALSE
